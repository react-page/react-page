# @semantic-release/exec is declared as a git dependency (semantic-release/exec),
# so its repository has to be approved explicitly.
approvedGitRepositories:
  - "https://github.com/semantic-release/exec.git"

# Several dependencies (fsevents, core-js, nx, husky, ...) need their build
# scripts to run; yarn 4 no longer enables them by default.
enableScripts: true

nodeLinker: node-modules
